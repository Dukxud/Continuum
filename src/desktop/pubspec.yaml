name: codex_resume_flutter
description: Continuum, a Windows desktop app for scheduling and monitoring Codex conversations.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/native/
  shaders:
    - shaders/aero_liquid.frag
