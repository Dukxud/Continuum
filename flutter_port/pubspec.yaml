name: codex_resume_flutter
description: Experimental Flutter desktop frontend for Codex Resume Scheduler
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/native/
  shaders:
    - shaders/aero_liquid.frag
