# Explicit manual verification only: no push/PR/schedule trigger, no retries.
# Record at most 2 manually selected CI attempts per candidate; then investigate.
# Production releases are deliberately disabled until separately authorized
# after trusted signing and target-Windows acceptance.
name: Tests (manual, bounded)
on:
  workflow_dispatch:
    inputs:
      validation_attempt:
        description: "Manual validation attempt (maximum two per candidate)"
        type: choice
        required: true
        default: '1'
        options: ['1', '2']
permissions:
  contents: read
concurrency:
  group: scheduler-manual-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete single-pass acceptance (PowerShell, JavaScript, WinForms, WebView2)
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./scripts/Invoke-LocalAcceptance.ps1 -ExpectedCommit $env:GITHUB_SHA
      - name: Upload Aero Windows rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-webview-windows-screenshots
          path: AeroScreenshots/*.png
          if-no-files-found: ignore
      - name: Assemble versioned review ZIP
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-CodexScheduler.ps1 -OutputDirectory ./PreviewArtifacts -Preview
      - name: Assemble reusable AeroProgress component preview
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-AeroComponent.ps1 -OutputDirectory ./ComponentArtifacts -Preview
      - name: Package standalone reusable modules
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-ReusableComponents.ps1 -OutputDirectory ./ReusableArtifacts -Preview
      - name: Upload standalone reusable modules
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ReusableComponents-Preview
          path: ReusableArtifacts/*.zip
          retention-days: 30
      - name: Upload standalone AeroProgress component
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AeroProgress-Component-Preview
          path: ComponentArtifacts/*.zip
          retention-days: 30
      - name: Upload integrated scheduler preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CodexResumeScheduler-v1.15.0-Adversarial-Modular-Preview
          path: PreviewArtifacts/*.zip
          retention-days: 30

