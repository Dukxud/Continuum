# Explicit manual verification only: no push/PR/schedule trigger, no retries.
# Record at most 2 manually selected CI attempts per candidate; then investigate.
# Production releases are deliberately disabled until separately authorized
# after trusted signing and target-Windows acceptance.
name: Tests (manual, bounded)
on:
  workflow_dispatch:
    inputs:
      validation_attempt:
        description: "Manual validation attempt (maximum two per candidate)"
        type: choice
        required: true
        default: '1'
        options: ['1', '2']
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduler-manual-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce per-commit validation ceiling
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
        run: |
          # Reject reruns and third dispatches before running any test.
          if ([int]$env:GITHUB_RUN_ATTEMPT -ne 1) { throw 'Reruns are disabled for the same candidate.' }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$env:GITHUB_SHA&event=workflow_dispatch&per_page=100"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -ErrorAction Stop
          $runs = @($response.workflow_runs | Where-Object { $_.head_sha -ceq $env:GITHUB_SHA })
          if (@($runs | Where-Object { [string]$_.id -eq $env:GITHUB_RUN_ID }).Count -ne 1) {
            throw 'Cannot verify the current workflow run. Validation refused.'
          }
          if ($runs.Count -gt 2) { throw 'Two CI attempts already exhausted for this commit.' }
          if ($runs.Count -ne [int]$env:VALIDATION_ATTEMPT) {
            throw "Attempt number must be $($runs.Count) for this commit."
          }
      - name: Parse acceptance entrypoint before running any tests
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Invoke-LocalAcceptance.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            throw ($parseErrors | Out-String)
          }
      - name: Complete single-pass acceptance (PowerShell, JavaScript, WinForms, WebView2)
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./scripts/Invoke-LocalAcceptance.ps1 -ExpectedCommit $env:GITHUB_SHA
      - name: Upload Aero Windows rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-webview-windows-screenshots
          path: AeroScreenshots/*.png
          if-no-files-found: ignore
      - name: Assemble versioned review ZIP
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-CodexScheduler.ps1 -OutputDirectory ./PreviewArtifacts -Preview
      - name: Assemble reusable AeroProgress component preview
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-AeroComponent.ps1 -OutputDirectory ./ComponentArtifacts -Preview
      - name: Package standalone reusable modules
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-ReusableComponents.ps1 -OutputDirectory ./ReusableArtifacts -Preview
      - name: Upload standalone reusable modules
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ReusableComponents-Preview
          path: ReusableArtifacts/*.zip
          retention-days: 30
      - name: Upload standalone AeroProgress component
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AeroProgress-Component-Preview
          path: ComponentArtifacts/*.zip
          retention-days: 30
      - name: Upload integrated scheduler preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CodexResumeScheduler-v1.15.0-Adversarial-Modular-Preview
          path: PreviewArtifacts/*.zip
          retention-days: 30

